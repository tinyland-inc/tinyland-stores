name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  packages: read
jobs:
  package:
    uses: xoxd-ai/ci-templates/.github/workflows/js-bazel-package.yml@v2.14.1
    with:
      runner_mode: repo_owned
      runner_labels_json: ${{ vars.PRIMARY_LINUX_RUNNER_LABELS_JSON }}
      workspace_mode: isolated
      publish_mode: hosted_exception
      # Bazel-only distribution (RU6/RU8): nothing is published to npmjs or
      # GitHub Packages. Releases are signed tags plus an xoxd-ai/bazel-registry
      # entry. The template defaults npm_publish_mode to "required", so it is
      # disabled explicitly here.
      npm_publish_mode: disabled
      dry_run: true
      node_versions: '["22"]'
      publish_node_version: "22"
      pnpm_version: "10.13.1"
      # The in-house deps resolve through Bazel only; validate via bazel.
      typecheck_command: ""
      unit_test_command: ""
      build_command: "true"
      package_check_command: "true"
      bazel_targets: "//:pkg //:test //:typecheck"
      package_dir: ./bazel-bin/pkg
    secrets: inherit
